<nav style="padding:12px 24px;background:#102f43"><a href="../index.html" style="color:white;font-weight:600">← Materiale · 5AFM2627</a></nav><header><div class="top"><div class="brand"><span class="mark" aria-hidden="true">+</span>Classe in gioco</div><button class="outline" id="teacherBtn">Area insegnante</button></div></header>
<div class="demo">Versione online da attivare · Collegamento dell’archivio non ancora configurato.</div>
<main class="wrap" id="app"></main>
<footer>Classe in gioco · Imparare, provare, migliorare.</footer>
<dialog id="login"><div class="dialogtop"><h2 id="loginTitle"></h2><button class="plain" id="closeLogin" aria-label="Chiudi">×</button></div><p class="muted" id="loginHelp"></p><form id="loginForm"><div id="teacherEmailGroup" hidden><label for="teacherEmail">Email insegnante</label><input id="teacherEmail" type="email" autocomplete="username"></div><label for="code">Codice di accesso</label><input id="code" type="password" autocomplete="off" required aria-describedby="loginHelp loginError"><p class="error" id="loginError" role="alert"></p><button class="primary" type="submit">Entra</button></form></dialog>
<script src="config.js"></script>
<script src="cloud.js"></script>
<script>
'use strict';
const activities=[{"id": "dare-avere", "name": "Dare o Avere?", "subject": "ECONOMIA AZIENDALE", "symbol": "D / A", "roundSize": 10, "desc": "Variazioni dei conti, costi e ricavi: 10 domande, 10 punti ciascuna. Il cronometro misura il tempo totale, comprese la lettura delle spiegazioni e le eventuali pause, fino all’ultima risposta."}, {"id": "accounting", "name": "Dalle operazioni al bilancio", "subject": "ECONOMIA AZIENDALE", "symbol": "€", "desc": "Registra le operazioni in partita doppia e completa il conto economico e lo stato patrimoniale."}];
let records=[],storageOK=true;
let student=null,role=null,loginFor=null,quiz=null;
const app=document.querySelector('#app'),dialog=document.querySelector('#login');
const best=(s,a)=>Math.max(0,...records.filter(r=>r.student===s&&r.activity===a).map(r=>r.score));
const total=s=>activities.reduce((n,a)=>n+best(s,a.id),0);
const count=s=>records.filter(r=>r.student===s).length;
const fmt=d=>new Intl.DateTimeFormat('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(d));

let quizTimer=null;
function stopQuizTimer(){if(quizTimer!==null){clearInterval(quizTimer);quizTimer=null;}}
function durationText(ms){if(!Number.isFinite(ms)||ms<0)return 'Non rilevato';const seconds=Math.floor(ms/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function quizDuration(){return quiz.durationMs??Math.max(0,Date.now()-quiz.startedAt);}
function tickQuizTimer(){const el=document.querySelector('#quizClock');if(el&&quiz?.a.id==='dare-avere')el.textContent=durationText(quizDuration());}
function timedAttemptsHTML(){const attempts=records.filter(r=>r.activity==='dare-avere');if(!attempts.length)return '';return `<section class="panel history"><h2>Dare o Avere? · Tempi dei tentativi</h2><p class="small">Tempo totale dalla prima domanda all’ultima risposta, comprese spiegazioni e pause. Il tempo non modifica i punti.</p><div class="tablewrap"><table><thead><tr><th>Studente</th><th>Data</th><th>Punteggio</th><th>Tempo (min:sec)</th></tr></thead><tbody>${[...attempts].reverse().map(r=>`<tr><td>N. ${r.student}</td><td>${fmt(r.date)}</td><td>${r.score}/100</td><td>${durationText(r.durationMs)}</td></tr>`).join('')}</tbody></table></div></section>`;}

function render(html){stopQuizTimer();app.innerHTML=html;const heading=app.querySelector('h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}window.scrollTo(0,0);}
function home(){role=null;student=null;quiz=null;document.querySelector('#teacherBtn').textContent='Area insegnante';render(`<p class="eyebrow">LA NOSTRA AULA · LA NOSTRA CLASSE</p><h1>Pronto a metterti in gioco?</h1><p class="muted">Scegli il tuo numero di registro. Le tue attività ti aspettano.</p><div class="layout"><section class="panel"><div class="panelhead"><h2>Qual è il tuo numero?</h2><span class="tag">26 studenti</span></div><div class="grid">${Array.from({length:26},(_,i)=>`<button class="number" data-student="${i+1}" aria-label="Accedi come studente ${i+1}">${String(i+1).padStart(2,'0')}</button>`).join('')}</div><p class="bottomnote">Scegli il tuo numero e inserisci il codice provvisorio 1234.</p></section><aside class="panel aside"><div><span class="tag" style="background:#ffffff20;color:white">UN PASSO ALLA VOLTA</span><h2 style="margin-top:25px">Ogni tentativo<br>è un nuovo inizio.</h2><ol class="steps"><li><span class="step">1</span>Scegli il tuo numero</li><li><span class="step">2</span>Inserisci il tuo codice</li><li><span class="step">3</span>Gioca e migliora</li></ol></div><p class="aside-note">Puoi riprovare tutte le volte che vuoi. Per ogni attività conta il tuo risultato migliore.</p></aside></div>`);app.querySelectorAll('[data-student]').forEach(b=>b.onclick=()=>openLogin(Number(b.dataset.student)));}
document.querySelector('#closeLogin').onclick=()=>dialog.close();
function dashboard(){quiz=null;render(`<p class="eyebrow">IL TUO SPAZIO · STUDENTE ${String(student).padStart(2,'0')}</p><h1>Cosa scopriamo oggi?</h1><p class="muted">Scegli un’attività, prova e supera il tuo record.</p><div class="scorebar"><strong>${total(student)}</strong><div><b>Punti totali</b><p class="small">su ${activities.length*100} disponibili</p></div><p class="muted">Il totale somma i tuoi risultati migliori.<br>Ogni attività indica come ottenere i punti.</p></div><section class="cards">${activities.map(a=>`<article class="panel card"><span class="symbol" aria-hidden="true">${a.symbol}</span><p class="eyebrow">${a.subject}</p><h2>${a.name}</h2><p>${a.desc}</p><div class="statline">${a.id==='accounting'?'4 scritture + bilancio finale':(a.roundSize||5)+' domande'} · Record: <b>${best(student,a.id)}/100</b></div><button class="primary" data-start="${a.id}">${records.some(r=>r.student===student&&r.activity===a.id)?'Gioca ancora':'Comincia'}</button></article>`).join('')}</section><p class="small">${count(student)} attività completate · Puoi riprovare senza perdere i punti già ottenuti.</p>`);app.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));}
function shuffle(list){let out=[...list];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function question(){const q=quiz.questions[quiz.index];quiz.answered=false;render(`<div class="quiz"><button class="plain back" id="quit">← Torna alle attività</button><div class="quiztop"><b>${quiz.a.name}</b><span class="small">Domanda ${quiz.index+1} di ${quiz.questions.length}</span></div>${quiz.a.id==='dare-avere'?`<div class="quiztop"><span class="tag">Tempo <span id="quizClock" style="margin-left:8px;font-variant-numeric:tabular-nums">${durationText(quizDuration())}</span></span><span class="small">2 costi · 2 ricavi · 6 variazioni</span></div>`:''}<progress value="${quiz.index}" max="${quiz.questions.length}" aria-label="Avanzamento attività"></progress><section class="panel"><p class="eyebrow">${quiz.a.subject}</p><h1 class="question">${q[0]}</h1><div class="answers">${q[1].map((text,i)=>`<button class="answer" data-answer="${i}">${text}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div></section><p class="bottomnote">${quiz.score} punti in questo tentativo</p></div>`);document.querySelector('#quit').onclick=()=>{if(confirm('Vuoi uscire dall’attività? Il tentativo in corso non verrà salvato.'))dashboard();};app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));if(quiz.a.id==='dare-avere'){tickQuizTimer();quizTimer=setInterval(tickQuizTimer,250);}}
function teacher(){if(role!=='teacher')return;const active=new Set(records.map(r=>r.student)).size;render(`<p class="eyebrow">AREA INSEGNANTE · LA NOSTRA CLASSE</p><div class="toolbar"><div><h1>I progressi della classe</h1><p class="muted">Uno sguardo alle attività e ai risultati di ogni studente.</p></div><button class="outline" id="refreshTeacher">Aggiorna risultati</button><button class="outline" id="resetScores" style="color:#a32121;border-color:#a32121">Azzera tutti i punteggi</button><button class="outline" id="export">↓ Scarica risultati CSV</button></div><div class="stats"><div class="panel stat"><span class="small">Studenti attivi</span><strong>${active}<span class="small"> / 26</span></strong></div><div class="panel stat"><span class="small">Tentativi conclusi</span><strong>${records.length}</strong></div><div class="panel stat"><span class="small">Punti della classe</span><strong>${Array.from({length:26},(_,i)=>total(i+1)).reduce((a,b)=>a+b,0)}</strong></div></div><section class="panel"><div class="panelhead"><h2>Registro delle attività</h2><span class="tag">Migliori punteggi</span></div><div class="tablewrap"><table><caption class="sr">Punteggi e tentativi dei 26 studenti</caption><thead><tr><th scope="col">Studente</th>${activities.map(a=>`<th scope="col">${a.name}</th>`).join('')}<th scope="col">Tentativi</th><th scope="col">Ultima attività</th><th scope="col">Totale</th></tr></thead><tbody>${Array.from({length:26},(_,i)=>{const s=i+1,rs=records.filter(r=>r.student===s),last=rs.at(-1);return `<tr><td>N. ${String(s).padStart(2,'0')}</td>${activities.map(a=>`<td>${rs.some(r=>r.activity===a.id)?best(s,a.id)+'/100':'—'}</td>`).join('')}<td>${rs.length}</td><td>${last?fmt(last.date):'Da iniziare'}</td><td>${total(s)} pt</td></tr>`;}).join('')}</tbody></table></div><p class="small" style="margin:18px 0 0">${records.length?'I risultati includono i tentativi consegnati online. Usa Aggiorna per leggere i nuovi risultati.':'Nessun tentativo ancora. Esci, accedi come studente e completa un’attività per vedere il primo risultato.'}</p></section>${timedAttemptsHTML()}<p class="bottomnote">I risultati consegnati sono conservati nell’archivio della classe.</p>`);document.querySelector('#refreshTeacher').onclick=refreshTeacher;document.querySelector('#export').onclick=exportCSV;accountingTeacherDetails();}
function exportCSV(){const rows=[['Studente',...activities.map(a=>a.name),'Tentativi','Totale'],...Array.from({length:26},(_,i)=>[i+1,...activities.map(a=>best(i+1,a.id)),count(i+1),total(i+1)]),[],['Dettaglio tentativi'],['Studente','Attività','Punti','Data','Tempo (min:sec)','Tempo (secondi)'],...records.map(r=>[r.student,activities.find(a=>a.id===r.activity).name,r.score,r.date,r.activity==='dare-avere'?durationText(r.durationMs):'',Number.isFinite(r.durationMs)&&r.durationMs>=0?Math.floor(r.durationMs/1000):''])];const blob=new Blob(['\ufeff'+rows.map(r=>r.join(';')).join('\r\n')],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='risultati-classe.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const accountNames={imm:'Immobilizzazioni',cred:'Crediti v/clienti',banca:'Banca c/c',forn:'Debiti v/fornitori',banche:'Debiti v/banche',pn:'Patrimonio netto iniziale',ivaC:'IVA a credito',ivaD:'IVA a debito',acq:'Merci c/acquisti',vend:'Merci c/vendite'};
const euro=n=>new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const baseCase={imm:45000,cred:18000,banca:12000,forn:15000,banche:20000,pn:40000,pag:6000,inc:9000,vend:25000,acq:14000};
const finalFields=[['cost','Merci c/acquisti','ce'],['revenue','Merci c/vendite','ce'],['income','Risultato d’esercizio (negativo se perdita)','ce'],['ceTotal','Totale a pareggio di ciascuna sezione del CE','ce'],['imm','Immobilizzazioni','att'],['cred','Crediti v/clienti','att'],['banca','Banca c/c','att'],['ivaC','IVA a credito','att'],['totalA','Totale attivo','att'],['forn','Debiti v/fornitori','pas'],['banche','Debiti v/banche','pas'],['ivaD','IVA a debito','pas'],['pn','Patrimonio netto iniziale, escluso il risultato','pas'],['profit','Risultato d’esercizio (negativo se perdita)','pas'],['totalP','Totale passivo e patrimonio netto','pas']];
function amount(raw){const s=String(raw??'').trim();if(!s)return null;if(!/^-?(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d{1,2})?$/.test(s))return NaN;return Math.round(Number(s.replaceAll('.','').replace(',','.'))*100)/100;}
function solution(d){const iv=d.vend*.22,ia=d.acq*.22,income=d.vend-d.acq;return {journals:[[{account:'forn',dare:d.pag,avere:0},{account:'banca',dare:0,avere:d.pag}],[{account:'banca',dare:d.inc,avere:0},{account:'cred',dare:0,avere:d.inc}],[{account:'cred',dare:d.vend+iv,avere:0},{account:'vend',dare:0,avere:d.vend},{account:'ivaD',dare:0,avere:iv}],[{account:'acq',dare:d.acq,avere:0},{account:'ivaC',dare:ia,avere:0},{account:'forn',dare:0,avere:d.acq+ia}]],finals:{cost:d.acq,revenue:d.vend,income,ceTotal:Math.max(d.vend,d.acq),imm:d.imm,cred:d.cred-d.inc+d.vend+iv,banca:d.banca-d.pag+d.inc,ivaC:ia,totalA:d.imm+d.cred-d.inc+d.vend+iv+d.banca-d.pag+d.inc+ia,forn:d.forn-d.pag+d.acq+ia,banche:d.banche,ivaD:iv,pn:d.pn,profit:income,totalP:d.forn-d.pag+d.acq+ia+d.banche+iv+d.pn+income}};}
function sameJournal(actual,expected){if(actual.some(r=>!Object.hasOwn(accountNames,r.account)||!((r.dare>0&&!(r.avere>0))||(r.avere>0&&!(r.dare>0)))))return false;const sum=rows=>{const m={};for(const r of rows){const key=r.account;m[key]??=[0,0];m[key][0]+=Math.round(r.dare*100);m[key][1]+=Math.round(r.avere*100);}return m;};const a=sum(actual),b=sum(expected);return Object.keys(a).length===Object.keys(b).length&&Object.keys(b).every(k=>a[k]&&a[k][0]===b[k][0]&&a[k][1]===b[k][1]);}
function gradeAccounting(d,answers){const target=solution(d);const journals=target.journals.map((j,i)=>sameJournal(answers.journals[i],j));const finals=Object.fromEntries(finalFields.map(([k])=>[k,Number.isFinite(answers.finals[k])&&Math.round(answers.finals[k]*100)===Math.round(target.finals[k]*100)]));return {journals,finals,journalScore:journals.filter(Boolean).length*10,finalScore:Object.values(finals).filter(Boolean).length*4,score:journals.filter(Boolean).length*10+Object.values(finals).filter(Boolean).length*4};}
function accountingPage(){const d=quiz.case;const descriptions=[`Pagati debiti verso fornitori per € ${euro(d.pag)} mediante bonifico bancario.`,`Incassati crediti verso clienti per € ${euro(d.inc)} tramite banca.`,`Emessa fattura per vendita di merci: imponibile € ${euro(d.vend)}, oltre IVA 22%. La fattura resta da incassare.`,`Ricevuta fattura per acquisto di merci: imponibile € ${euro(d.acq)}, oltre IVA 22%. La fattura resta da pagare.`];
const initial=keys=>`<table><tbody>${keys.map(k=>`<tr><td>${accountNames[k]}</td><td>€ ${euro(d[k])}</td></tr>`).join('')}</tbody></table>`;
const inputs=group=>finalFields.filter(f=>f[2]===group).map(([k,label])=>`<div class="final-row" id="row-${k}"><label for="f-${k}">${label}</label><input id="f-${k}" name="${k}" inputmode="decimal" autocomplete="off" placeholder="Importo in €" aria-describedby="amount-help"><span class="field-check" id="check-${k}"></span></div>`).join('');
render(`<div class="accounting"><button class="plain back" type="button" id="accountBack">← Le mie attività</button><p class="eyebrow">ECONOMIA AZIENDALE · LABORATORIO 5 AFM</p><h1>Dalle operazioni al bilancio</h1><p class="muted">Beta S.n.c. · Traccia ${quiz.variant+1} · Svolgi i calcoli sul quaderno e consegna qui il tuo elaborato.</p><div class="exercise-rules"><b>100 punti disponibili</b><span>4 scritture × 10 punti</span><span>15 importi finali × 4 punti</span></div><section class="panel accounting-section"><p class="eyebrow">01 · I DATI DI PARTENZA</p><h2>Situazione patrimoniale al 1° gennaio</h2><div class="balance-grid"><div><h3>Attivo</h3>${initial(['imm','cred','banca'])}</div><div><h3>Passivo e patrimonio netto</h3>${initial(['forn','banche','pn'])}</div></div><details class="assumptions" open><summary>Ipotesi dell’esercizio</summary><p>Modello didattico semplificato: considera solo le quattro operazioni indicate. IVA al 22% su acquisti e vendite, interamente detraibile sugli acquisti; non effettuare la liquidazione IVA e mantieni separati IVA a credito e IVA a debito. Rimanenze iniziali e finali nulle. Non rilevare ammortamenti, imposte, interessi né altre scritture di assestamento. Riporta le immobilizzazioni al valore iniziale. Non sono richieste le scritture di apertura, epilogo e chiusura.</p></details></section><form id="accountForm" novalidate><section class="panel accounting-section"><p class="eyebrow">02 · IL LIBRO GIORNALE</p><h2>Registra le quattro operazioni</h2><p class="muted">Scegli i conti e inserisci tu gli importi in Dare o in Avere. Compila solo le righe necessarie. IVA e totali delle fatture sono da calcolare.</p><p class="small" id="amount-help">Formato italiano: 30500 oppure 30.500,00. Usa la virgola per i decimali. Nelle colonne non utilizzate lascia vuoto o scrivi 0.</p>${descriptions.map((text,i)=>`<fieldset class="journal" id="journal-${i}"><legend>Operazione ${i+1}</legend><p>${text}</p><div class="journal-heading" aria-hidden="true"><span>Conto</span><span>Dare (€)</span><span>Avere (€)</span></div>${Array.from({length:4},(_,r)=>`<div class="journal-line"><select id="j-${i}-${r}-account" aria-label="Operazione ${i+1}, riga ${r+1}, conto"><option value="">Scegli il conto</option>${Object.entries(accountNames).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input id="j-${i}-${r}-dare" inputmode="decimal" placeholder="Dare" aria-label="Operazione ${i+1}, riga ${r+1}, Dare" aria-describedby="amount-help"><input id="j-${i}-${r}-avere" inputmode="decimal" placeholder="Avere" aria-label="Operazione ${i+1}, riga ${r+1}, Avere" aria-describedby="amount-help"></div>`).join('')}<p class="journal-check" id="jcheck-${i}"></p></fieldset>`).join('')}</section><section class="panel accounting-section"><p class="eyebrow">03 · IL CONTO ECONOMICO</p><h2>Determina il risultato dell’esercizio</h2><p class="muted">Ricostruisci i saldi sul quaderno, poi completa ogni importo. Il totale a pareggio comprende l’utile nella sezione costi, oppure la perdita nella sezione ricavi.</p>${inputs('ce')}</section><section class="panel accounting-section"><p class="eyebrow">04 · LO STATO PATRIMONIALE</p><h2>Inserisci la situazione finale al 31 dicembre</h2><p class="muted">Calcola anche i totali. Riporta il patrimonio netto iniziale e il risultato d’esercizio su due righe distinte.</p><div class="balance-grid"><div><h3>Attivo</h3>${inputs('att')}</div><div><h3>Passivo e patrimonio netto</h3>${inputs('pas')}</div></div></section><div class="panel accounting-section"><p id="accountError" class="error" role="alert"></p><button class="primary" type="submit" id="accountSubmit">Consegna scritture e bilancio</button><p class="small" style="margin-top:14px">Puoi consegnare anche con voci in bianco: le risposte mancanti valgono 0 punti. Le parti compilate vengono corrette alla consegna. La sola quadratura non basta: devono essere corretti i conti, le sezioni e gli importi. Nel totale personale conta il tentativo migliore.</p></div></form><div id="accountResult" aria-live="polite"></div></div>`);
document.querySelector('#accountBack').onclick=()=>{if(quiz.done||confirm('Uscire? Il lavoro non consegnato andrà perso.'))dashboard();};document.querySelector('#accountForm').onsubmit=submitAccounting;}
function collectAccounting(){const answers={journals:[],finals:{}};for(let i=0;i<4;i++){const rows=[];for(let r=0;r<4;r++){const prefix=`#j-${i}-${r}-`;const account=document.querySelector(prefix+'account').value;const dv=amount(document.querySelector(prefix+'dare').value),av=amount(document.querySelector(prefix+'avere').value);if(!account&&(dv===null||dv===0)&&(av===null||av===0))continue;const dare=dv??0,avere=av??0;if(!Number.isFinite(dare)||!Number.isFinite(avere)||dare<0||avere<0||(dare>0&&avere>0))throw Error(`Operazione ${i+1}, riga ${r+1}: usa importi validi non negativi, in una sola colonna. Puoi lasciare le voci in bianco.`);rows.push({account,dare:dv,avere:av});}answers.journals.push(rows);}for(const [k,label] of finalFields){const v=amount(document.querySelector('#f-'+k).value);if(v!==null&&!Number.isFinite(v))throw Error(`«${label}»: inserisci un importo valido oppure lascia in bianco. Usa la virgola per i decimali.`);if(v<0&&!['income','profit'].includes(k))throw Error(`«${label}»: inserisci un importo non negativo.`);answers.finals[k]=v;}return answers;}

async function submitAccounting(event){event.preventDefault();if(!quiz||quiz.done||quiz.sending||role!=='student')return;let answers;try{answers=collectAccounting();}catch(e){document.querySelector('#accountError').textContent=e.message;document.querySelector('#accountError').scrollIntoView({block:'center'});return;}document.querySelector('#accountError').textContent='';const current=quiz,previous=best(student,'accounting');current.sending=true;document.querySelector('#accountSubmit').disabled=true;let record;try{record=await Cloud.accounting(current.id,answers);}catch(e){document.querySelector('#accountError').textContent=e.message;document.querySelector('#accountSubmit').disabled=false;current.sending=false;return;}if(quiz!==current)return;current.sending=false;current.done=true;const grade=record.grade;rememberRecord(record);document.querySelectorAll('#accountForm input, #accountForm select, #accountSubmit').forEach(el=>el.disabled=true);grade.journals.forEach((ok,i)=>{document.querySelector('#jcheck-'+i).textContent=ok?'✓ Scrittura corretta · 10/10 punti':answers.journals[i].length===0?'Non compilata · 0/10 punti':'Da rivedere o completare: conti, Dare/Avere o importi · 0/10 punti';document.querySelector('#journal-'+i).classList.add(ok?'assessed-ok':'assessed-wrong');});for(const [k] of finalFields){const ok=grade.finals[k];document.querySelector('#check-'+k).textContent=ok?'✓ Corretto · 4 pt':answers.finals[k]===null?'Non compilato · 0 pt':'Da rivedere · 0 pt';document.querySelector('#row-'+k).classList.add(ok?'assessed-ok':'assessed-wrong');}
const result=document.querySelector('#accountResult');result.innerHTML=`<section class="panel result"><p class="eyebrow">ELABORATO CONSEGNATO</p><h2>${grade.score===100?'Scritture e bilancio corretti!':'Ecco il tuo risultato'}</h2><div class="bigscore">${grade.score}<span style="font-size:24px;letter-spacing:0"> / 100</span></div><p>Scritture: <b>${grade.journalScore}/40</b> · Bilancio: <b>${grade.finalScore}/60</b></p><p>${grade.score>previous?`Il tuo totale aumenta di ${grade.score-previous} punti.`:'Il tuo record precedente resta invariato.'}</p><p class="muted">Rileggi le voci contrassegnate. Puoi fare un nuovo tentativo con dati diversi.</p><button class="primary" id="newAccounting">Nuova traccia</button><button class="outline" id="accountDashboard">Le mie attività</button><p class="small" style="margin-top:16px">${storageOK?'Punteggio ed elaborato salvati online.':'Salvataggio non disponibile: il risultato rimane solo in questa pagina finché è aperta.'}</p></section>`;document.querySelector('#newAccounting').onclick=startAccounting;document.querySelector('#accountDashboard').onclick=dashboard;result.scrollIntoView({block:'start',behavior:'smooth'});}

let starting=false, pendingStart=null;
function cloudStatus(message){const el=document.querySelector('.demo');if(el)el.textContent=message;}
function rememberRecord(record){records=records.filter(r=>r.id!==record.id);records.push(record);storageOK=true;}
function openLogin(target){loginFor=target;document.querySelector('#loginTitle').textContent=target==='teacher'?'Accesso insegnante':`Ciao, numero ${target}!`;document.querySelector('#loginHelp').textContent=target==='teacher'?'Usa la tua email e la password personale.':'Per ora il codice per tutti gli studenti è 1234.';document.querySelector('#teacherEmailGroup').hidden=target!=='teacher';document.querySelector('#teacherEmail').required=target==='teacher';document.querySelector('#code').value='';document.querySelector('#loginError').textContent='';dialog.showModal();document.querySelector(target==='teacher'?'#teacherEmail':'#code').focus();}
document.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button[type="submit"]');button.disabled=true;document.querySelector('#loginError').textContent='Accesso in corso…';try{const data=await Cloud.login(loginFor,document.querySelector('#code').value,document.querySelector('#teacherEmail').value.trim());role=data.profile.role;student=data.profile.student;records=data.records;document.querySelector('#code').value='';dialog.close();document.querySelector('#teacherBtn').textContent='Esci';cloudStatus('Connesso · I risultati consegnati sono salvati online.');if(role==='teacher')teacher();else dashboard();}catch(error){document.querySelector('#loginError').textContent=error.message;}finally{button.disabled=false;}};
document.querySelector('#teacherBtn').onclick=async()=>{if(role){if(quiz&&!quiz.done&&!confirm('Vuoi uscire? Il tentativo in corso non sarà completato.'))return;stopQuizTimer();await Cloud.logout();records=[];pendingStart=null;home();cloudStatus(Cloud.configured()?'Accesso personale · Risultati salvati online dopo la consegna.':'Versione online da attivare · Collegamento dell’archivio non ancora configurato.');}else openLogin('teacher');};
async function start(id){
 if(starting)return;
 if(role!=='student')throw Error('Accesso studente richiesto.');
 const a=activities.find(x=>x.id===id);if(!a)throw Error('Attività non valida.');
 starting=true;
 if(!pendingStart||pendingStart.activity!==id)pendingStart={activity:id,request:crypto.randomUUID()};
 try{cloudStatus('Apertura dell’attività…');const response=await Cloud.start(id,pendingStart.request);pendingStart=null;
  quiz={a,id:response.id,startedAt:Date.now(),previousBest:best(student,id),index:0,score:0,answered:false,done:false};
  if(id==='accounting'){quiz.case=response.case;quiz.variant=response.variant;accountingPage();}
  else{quiz.questions=response.questions;quiz.points=100/response.questions.length;question();}
  cloudStatus('Connesso · I risultati consegnati sono salvati online.');
 }catch(e){cloudStatus(e.message);}finally{starting=false;}
}
function startAccounting(){return start('accounting');}
async function answer(i){
 if(!quiz||quiz.answered||quiz.done||quiz.sending)return;
 const current=quiz;current.sending=true;
 app.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);
 try{
  const response=await Cloud.answer(current.id,current.index,i);
  if(quiz!==current)return;
  current.answered=true;current.score=response.score;
  if(response.done){current.savedRecord=response.record;current.durationMs=response.durationMs;tickQuizTimer();stopQuizTimer();}
  app.querySelectorAll('[data-answer]').forEach(b=>{if(Number(b.dataset.answer)===response.correctIndex)b.classList.add('correct');else if(Number(b.dataset.answer)===i)b.classList.add('wrong');});
  const feedback=document.querySelector('#feedback');feedback.innerHTML='<p></p><button class="primary" id="next"></button>';
  feedback.querySelector('p').textContent=(response.correct?'Esatto! +'+current.points+' punti. ':'Risposta non corretta. ')+response.explanation;
  const next=document.querySelector('#next');next.textContent=response.done?'Guarda il risultato':'Prossima domanda →';next.onclick=()=>{if(current.index<current.questions.length-1){current.index++;question();}else finish();};next.focus();
 }catch(e){if(quiz===current){document.querySelector('#feedback').textContent=e.message;app.querySelectorAll('[data-answer]').forEach(b=>b.disabled=false);}}finally{current.sending=false;}
}
function finish(){
 if(!quiz||quiz.done||!quiz.savedRecord)return;
 quiz.done=true;rememberRecord(quiz.savedRecord);const previous=quiz.previousBest;
 render(`<section class="panel result"><p class="eyebrow">ATTIVITÀ COMPLETATA</p><h1>${quiz.score===100?'Tutte le risposte corrette!':'Un altro passo avanti!'}</h1><div class="bigscore">${quiz.score}<span style="font-size:24px;letter-spacing:0"> / 100</span></div><p>${quiz.score/quiz.points} risposte corrette su ${quiz.questions.length}.</p>${quiz.a.id==='dare-avere'?`<p><b>Tempo impiegato: ${durationText(quiz.durationMs)}</b> <span class="small">(min:sec)</span></p>`:''}<p>${quiz.score>previous?`Hai migliorato il tuo record: +${quiz.score-previous} punti nel totale.`:'Il tuo record resta invariato.'}</p><span class="tag">Totale personale: ${total(student)} punti</span><div><button class="primary" id="again">Riprova</button><button class="outline" id="activities">Le mie attività</button></div><p class="small" style="margin-top:18px">Risultato salvato online.</p></section>`);
 document.querySelector('#again').onclick=()=>start(quiz.a.id);document.querySelector('#activities').onclick=dashboard;
}
async function resetScores(){
 if(role!=='teacher')return;
 if(!confirm('Azzerare i risultati di tutti i 26 studenti?\n\nPunti, tempi e consegne precedenti saranno archiviati e non compariranno più nel registro o nelle esportazioni. Anche le attività già iniziate saranno escluse: gli studenti dovranno avviarne una nuova. Gli accessi resteranno invariati.\n\nPuoi scaricare prima i risultati CSV. Confermi?'))return;
 const button=document.querySelector('#resetScores');
 button.disabled=true;
 button.textContent='Azzeramento in corso…';
 try{await Cloud.resetScores();records=[];teacher();cloudStatus('Punteggi azzerati. Gli studenti devono rientrare nella propria area e avviare una nuova attività.');}
 catch(error){cloudStatus('Azzeramento non confermato: '+error.message+' Premi Aggiorna risultati per verificare.');}
 finally{button.disabled=false;button.textContent='Azzera tutti i punteggi';}
}
document.addEventListener('click',event=>{if(event.target.closest('#resetScores'))resetScores();});
async function refreshTeacher(){const button=document.querySelector('#refreshTeacher');if(button)button.disabled=true;try{records=await Cloud.records();teacher();cloudStatus('Risultati aggiornati dall’archivio online.');}catch(e){cloudStatus(e.message);}finally{if(button)button.disabled=false;}}

if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'start_student_activity',description:'Avvia una attività per lo studente già entrato nella demo. Non risponde alle domande e non assegna punti.',inputSchema:{type:'object',properties:{activity:{type:'string',enum:activities.map(a=>a.id)}},required:['activity'],additionalProperties:false},annotations:{readOnlyHint:false},async execute(input){if(!input||typeof input.activity!=='string')throw Error('Specificare una attività valida.');await start(input.activity);if(!quiz)throw Error('Impossibile avviare l’attività.');return {activity:quiz.a.name,stage:quiz.a.id==='accounting'?'scritture e bilancio':'domanda 1'};}})).catch(()=>{});}catch(e){}}
function accountingTeacherDetails(){const submissions=records.filter(r=>r.activity==='accounting'&&r.answers&&r.case);if(!submissions.length)return;const host=document.createElement('section');host.className='panel history';host.innerHTML='<h2>Elaborati di contabilità</h2><p class="small">Apri un tentativo per confrontare le risposte consegnate con la correzione.</p>';for(const r of [...submissions].reverse()){try{const g=gradeAccounting(r.case,r.answers),sol=solution(r.case);const detail=document.createElement('details');detail.className='attempt-detail';const safeMoney=n=>n===null?'Non compilato':Number.isFinite(n)?euro(n):'Non valido';detail.innerHTML=`<summary>Studente ${r.student} · ${fmt(r.date)} · ${g.score}/100 punti</summary><p>Scritture ${g.journalScore}/40 · Bilancio ${g.finalScore}/60</p><p class="small">Traccia: pagamento fornitori € ${safeMoney(r.case.pag)}; incasso clienti € ${safeMoney(r.case.inc)}; vendita € ${safeMoney(r.case.vend)} + IVA; acquisto € ${safeMoney(r.case.acq)} + IVA.</p>${r.answers.journals.map((rows,i)=>`<h3>Operazione ${i+1} · ${g.journals[i]?'Corretta':rows.length===0?'Non compilata':'Da rivedere o completare'}</h3><div class="tablewrap"><table><thead><tr><th>Conto consegnato</th><th>Dare</th><th>Avere</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${accountNames[row.account]||(row.account===''?'Non compilato':'Conto non valido')}</td><td>${safeMoney(row.dare)}</td><td>${safeMoney(row.avere)}</td></tr>`).join('')}</tbody></table></div>${!g.journals[i]?`<p class="small">Correzione: ${sol.journals[i].map(row=>`${accountNames[row.account]} ${row.dare?'Dare':'Avere'} ${safeMoney(row.dare||row.avere)}`).join(' · ')}</p>`:''}`).join('')}<h3>Bilancio finale</h3><div class="tablewrap"><table><thead><tr><th>Voce</th><th>Consegnato</th><th>Corretto</th></tr></thead><tbody>${finalFields.map(([k,label,section])=>`<tr><td>${section==='ce'?'CE':section==='att'?'SP attivo':'SP passivo'} · ${label}</td><td>${safeMoney(r.answers.finals[k])}</td><td>${safeMoney(sol.finals[k])} ${g.finals[k]?'✓':'✗'}</td></tr>`).join('')}</tbody></table></div>`;host.appendChild(detail);}catch(e){/* Skip malformed local demo submissions. */}}app.appendChild(host);}

home();
cloudStatus(Cloud.configured()?'Accesso personale · Risultati salvati online dopo la consegna.':'Versione online da attivare · Collegamento dell’archivio non ancora configurato.');
